<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tittel">Car Details</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div class="header">
        <img src="/Bilder/20883.png" alt="Logo" style="width: 40px; height: 40px; margin-right: 10px;">
        <h1>AutoNett</h1>
        <nav>
            <a href="index.html">Hjem</a>
            <a href="#" class="active">Biler</a>
            <a href="#">Om oss</a>
            <a href="#">Kontakt</a>
        </nav>
    </div>

    <div id="main-container" style="    justify-content: center; align-items: center;">
        <div></div>
        <div id="bil-container"></div>
        <div id="kontakt-container">
            <div id="ContactModal" class="modal">
                <div class="modal-content">
                    <form id="contactForm">
                        <img id="closeContactModal" src="./ikoner/close.png" alt="Lukk" style="cursor: pointer;">
                        <h2>Kontakt Selger</h2>
                        <div id="form-container">
                            <label for="ct-navn">Navn:</label>
                            <input type="text" id="ct-navn" required>
                            <label for="ct-epost">E-post:</label>
                            <input type="email" id="ct-epost" required>
                            <label for="ct-melding">Melding:</label>
                            <textarea id="ct-melding" required></textarea>
                            <button type="submit">Send</button>
                        </div>
                    </form>
                </div>
            </div>
            <h2>Kontakt Info</h2>
            <button class="kontakt">Kontakt</button>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
